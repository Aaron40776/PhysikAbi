<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220" role="img" aria-label="Mach-Zehnder-Interferometer">
  <defs>
    <marker id="pfeil" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1F3864"/>
    </marker>
  </defs>
  <rect width="400" height="220" fill="#ffffff"/>
  <!-- Laser -->
  <rect x="18" y="96" width="58" height="28" rx="3" fill="#EAF2F8" stroke="#1F3864" stroke-width="1.8"/>
  <text x="47" y="114" font-family="DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" fill="#1F3864">Laser</text>
  <!-- Strahl zur ersten Weiche -->
  <line x1="76" y1="110" x2="148" y2="110" stroke="#1F3864" stroke-width="2" marker-end="url(#pfeil)"/>
  <!-- Strahlteiler 1: Wuerfel mit Diagonale -->
  <rect x="138" y="88" width="44" height="44" fill="#E8F6F3" stroke="#1F3864" stroke-width="1.8"/>
  <line x1="138" y1="132" x2="182" y2="88" stroke="#1F3864" stroke-width="2.4"/>
  <text x="160" y="84" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1F3864">ST1</text>
  <!-- oberer Arm: ST1 nach oben, M1, dann nach rechts zu ST2 -->
  <line x1="160" y1="88" x2="160" y2="58" stroke="#1F3864" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="138" y1="42" x2="182" y2="42" stroke="#1F3864" stroke-width="2.4"/>
  <line x1="160" y1="42" x2="160" y2="12" stroke="#1F3864" stroke-width="0.8" stroke-dasharray="2 2"/>
  <text x="122" y="46" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#1F3864">M1</text>
  <line x1="182" y1="42" x2="238" y2="42" stroke="#1F3864" stroke-width="2" marker-end="url(#pfeil)"/>
  <!-- unterer Arm: ST1 nach rechts, M2, dann nach oben zu ST2 -->
  <line x1="182" y1="110" x2="238" y2="110" stroke="#1F3864" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="238" y1="88" x2="238" y2="132" stroke="#1F3864" stroke-width="2.4"/>
  <line x1="238" y1="132" x2="238" y2="162" stroke="#1F3864" stroke-width="0.8" stroke-dasharray="2 2"/>
  <text x="246" y="146" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#1F3864">M2</text>
  <line x1="238" y1="88" x2="238" y2="52" stroke="#1F3864" stroke-width="2" marker-end="url(#pfeil)"/>
  <!-- Strahlteiler 2 -->
  <rect x="216" y="30" width="44" height="44" fill="#E8F6F3" stroke="#1F3864" stroke-width="1.8"/>
  <line x1="216" y1="74" x2="260" y2="30" stroke="#1F3864" stroke-width="2.4"/>
  <text x="238" y="26" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1F3864">ST2</text>
  <!-- Ausgaenge -->
  <line x1="260" y1="42" x2="340" y2="42" stroke="#1F3864" stroke-width="2" marker-end="url(#pfeil)"/>
  <rect x="340" y="30" width="42" height="24" rx="3" fill="#FDF3E7" stroke="#1F3864" stroke-width="1.6"/>
  <text x="361" y="46" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1F3864">D1</text>
  <line x1="238" y1="74" x2="238" y2="132" stroke="#1F3864" stroke-width="2" marker-end="url(#pfeil)"/>
  <rect x="216" y="132" width="44" height="24" rx="3" fill="#FDF3E7" stroke="#1F3864" stroke-width="1.6"/>
  <text x="238" y="148" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1F3864">D2</text>
  <!-- Phasenplaettchen im oberen Arm -->
  <rect x="152" y="62" width="16" height="18" fill="#F4F0FA" stroke="#1F3864" stroke-width="1.4"/>
  <text x="188" y="76" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#1F3864">Phasenplättchen</text>
  <text x="188" y="88" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#1F3864">Δφ</text>
  <!-- Beschriftung der Arme -->
  <text x="114" y="30" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#555555">oberer Arm</text>
  <text x="260" y="174" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#555555">unterer Arm</text>
</svg>