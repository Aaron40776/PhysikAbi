<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" role="img" aria-label="Mach-Zehnder-Interferometer">
  <defs>
    <marker id="pfeil" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1F3864"/>
    </marker>
  </defs>
  <rect width="400" height="250" fill="#ffffff"/>
  <!-- Laser -->
  <rect x="18" y="146" width="58" height="28" rx="3" fill="#EAF2F8" stroke="#1F3864" stroke-width="1.8"/>
  <text x="47" y="164" font-family="DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" fill="#1F3864">Laser</text>
  <line x1="76" y1="160" x2="138" y2="160" stroke="#1F3864" stroke-width="2" marker-end="url(#pfeil)"/>
  <!-- Strahlteiler 1 -->
  <rect x="138" y="138" width="44" height="44" fill="#E8F6F3" stroke="#1F3864" stroke-width="1.8"/>
  <line x1="138" y1="182" x2="182" y2="138" stroke="#1F3864" stroke-width="2.4"/>
  <text x="160" y="134" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1F3864">ST1</text>
  <!-- oberer Arm -->
  <line x1="160" y1="138" x2="160" y2="102" stroke="#1F3864" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="138" y1="94" x2="182" y2="94" stroke="#1F3864" stroke-width="2.4"/>
  <line x1="160" y1="94" x2="160" y2="70" stroke="#1F3864" stroke-width="0.8" stroke-dasharray="2 2"/>
  <text x="120" y="98" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#1F3864">M1</text>
  <line x1="182" y1="94" x2="238" y2="94" stroke="#1F3864" stroke-width="2" marker-end="url(#pfeil)"/>
  <!-- unterer Arm -->
  <line x1="182" y1="160" x2="238" y2="160" stroke="#1F3864" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="238" y1="138" x2="238" y2="182" stroke="#1F3864" stroke-width="2.4"/>
  <line x1="238" y1="182" x2="238" y2="206" stroke="#1F3864" stroke-width="0.8" stroke-dasharray="2 2"/>
  <text x="246" y="196" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#1F3864">M2</text>
  <line x1="238" y1="138" x2="238" y2="106" stroke="#1F3864" stroke-width="2" marker-end="url(#pfeil)"/>
  <!-- Strahlteiler 2 -->
  <rect x="216" y="80" width="44" height="44" fill="#E8F6F3" stroke="#1F3864" stroke-width="1.8"/>
  <line x1="216" y1="124" x2="260" y2="80" stroke="#1F3864" stroke-width="2.4"/>
  <text x="238" y="76" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1F3864">ST2</text>
  <!-- Ausgänge -->
  <line x1="260" y1="94" x2="340" y2="94" stroke="#1F3864" stroke-width="2" marker-end="url(#pfeil)"/>
  <rect x="340" y="82" width="42" height="24" rx="3" fill="#FDF3E7" stroke="#1F3864" stroke-width="1.6"/>
  <text x="361" y="98" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1F3864">D1</text>
  <line x1="238" y1="80" x2="238" y2="44" stroke="#1F3864" stroke-width="2" marker-end="url(#pfeil)"/>
  <rect x="216" y="20" width="44" height="24" rx="3" fill="#FDF3E7" stroke="#1F3864" stroke-width="1.6"/>
  <text x="238" y="36" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1F3864">D2</text>
  <!-- Phasenplättchen -->
  <rect x="152" y="110" width="16" height="18" fill="#F4F0FA" stroke="#1F3864" stroke-width="1.4"/>
  <text x="188" y="120" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#1F3864">Phasenplättchen</text>
  <text x="188" y="132" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#1F3864">Δφ</text>
  <text x="92" y="80" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#555555">oberer Arm</text>
  <text x="270" y="220" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#555555">unterer Arm</text>
</svg>