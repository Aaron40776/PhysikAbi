name: Seiten bauen und veröffentlichen

on:
  push:
    branches: [main]
    paths:
      - "Physik_Vorabi_2026/03_Lernskripte/**"
      - "Physik_Vorabi_2026/build/make_pages.py"
      - "Physik_Vorabi_2026/build/make_lesen.py"
      - "Physik_Vorabi_2026/build/lesen/**"
      - "Physik_Vorabi_2026/build/test_pages.py"
      - "Physik_Vorabi_2026/build/test_browser.py"
      - "Physik_Vorabi_2026/build/src/**"
      - "Physik_Vorabi_2026/build/fig/**"
      - "Physik_Vorabi_2026/05_Grafiken/**"
      - "Physik_Vorabi_2026/build/glossar.json"
      - "Physik_Vorabi_2026/build/web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Typst installieren
        run: |
          curl -fsSL -o /tmp/typst.tar.xz https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
          tar -xJf /tmp/typst.tar.xz -C /tmp
          echo "/tmp/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: PyMuPDF installieren
        run: pip install --quiet "pymupdf==2.0"
      - name: Playwright installieren
        run: |
          pip install --quiet "playwright==1.64.1"
          python -m playwright install --with-deps chromium
      - name: PDFs und Leseseiten neu bauen
        run: ./Physik_Vorabi_2026/build/build_all.sh
      - name: Build-Artefakte sind aktuell
        run: git diff --exit-code -- Physik_Vorabi_2026/03_Lernskripte Physik_Vorabi_2026/04_Zusatzmaterial
      - name: Index, Links und Suche testen
        run: python Physik_Vorabi_2026/build/test_pages.py
      - name: Browser-Tests
        run: python Physik_Vorabi_2026/build/test_browser.py
      - name: Übersicht und PDFs sammeln
        run: python Physik_Vorabi_2026/build/make_pages.py --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
