name: Seiten bauen und veröffentlichen

on:
  push:
    branches: [main]
    paths:
      - "Physik_Vorabi_2026/03_Lernskripte/**"
      - "Physik_Vorabi_2026/04_Zusatzmaterial/**"
      - "Physik_Vorabi_2026/build/make_pages.py"
      - "Physik_Vorabi_2026/build/web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PyMuPDF installieren
        run: pip install --quiet pymupdf
      - name: Index, Links und Suche testen
        run: python Physik_Vorabi_2026/build/test_pages.py
      - name: Übersicht und PDFs sammeln
        run: python Physik_Vorabi_2026/build/make_pages.py --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
